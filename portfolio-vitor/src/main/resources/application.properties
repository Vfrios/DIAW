spring.application.name=portfolio
server.port=${PORT:8080}

# --- E-mail (SMTP do Gmail) ---
# Em desenvolvimento os valores vêm de config/application.properties (não vai pro Git).
# Na nuvem (Render) vêm das variáveis de ambiente MAIL_USERNAME, MAIL_PASSWORD e MAIL_TO.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# Quem recebe as mensagens do formulário (padrão: o próprio remetente)
portfolio.contact.to=${MAIL_TO:${MAIL_USERNAME:}}
