services:
  - type: web
    name: diaw-completo
    branch: main
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: MODO
        value: sob-demanda
      - key: MAX_APPS
        value: "2"
      - key: MEM_LIMIT_MB
        value: "360"
      - key: IDLE_MINUTOS
        value: "10"
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_TO
        sync: false
