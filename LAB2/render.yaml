services:
  - type: web
    name: drivenow-lab2
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: LAB2/Dockerfile
    dockerContext: LAB2
    healthCheckPath: /
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
