spring:
  application:
    name: aluguel-carros
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://db.viljqddwqkmnsrpqfayl.supabase.co:5432/postgres}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update   # cria/atualiza as tabelas no Supabase automaticamente
    properties:
      hibernate:
        format_sql: true

server:
  address: 0.0.0.0
  port: ${PORT:${SERVER_PORT:8080}}

app:
  jwt:
    secret: ${JWT_SECRET:troque-esta-chave-em-producao-minimo-32-caracteres}
    expiration-hours: 8
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:${RENDER_EXTERNAL_URL:http://localhost:5173}}
