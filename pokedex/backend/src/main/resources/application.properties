spring.application.name=pokedex-api
server.port=8080

# Carrega as variáveis do arquivo .env (executar o backend a partir da pasta backend/).
# Variáveis de ambiente do sistema também funcionam e têm prioridade.
spring.config.import=optional:file:.env[.properties]

# Conexão com o MongoDB Atlas (definida no .env)
spring.data.mongodb.uri=${POKEDEX_MONGODB_URI:${MONGODB_URI}}

# CORS: origens permitidas (frontend Vite)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Popula o banco com os dados do Script_Pokedex.sql se a coleção estiver vazia
app.seed.enabled=${SEED_ENABLED:true}
